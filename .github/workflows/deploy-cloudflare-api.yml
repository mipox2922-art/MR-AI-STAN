name: Deploy MR AI API to Cloudflare Containers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-cloudflare-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deployment stopped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions repository secrets."
            exit 1
          fi
          echo "Cloudflare deployment credentials are present."

      - name: Verify Cloudflare Account API token validity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --connect-timeout 10 --max-time 30 -sS \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cloudflare account-token verification failed (HTTP $http_code). Response:"
            cat "$response_file"
            echo
            echo "Confirm this is the Account ID that owns the account token and that the secret contains the full token value."
            exit 1
          fi
          if ! python -c 'import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if d.get("success") and d.get("result",{}).get("status") == "active" else 1)' "$response_file"; then
            echo "::error::Cloudflare account API token is not active. Response:"
            cat "$response_file"
            exit 1
          fi
          echo "Cloudflare Account API token is valid and active."

      - name: Verify Cloudflare Containers API access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --connect-timeout 10 --max-time 30 -sS \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/me")"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cloudflare Containers API denied access (HTTP $http_code). Cloudflare response:"
            cat "$response_file"
            echo
            echo "Check Account permissions for Workers Containers Read and Workers Containers Write, and confirm the account has the Workers Paid plan."
            exit 1
          fi
          if ! python -c 'import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if d.get("success") else 1)' "$response_file"; then
            echo "::error::Cloudflare Containers API returned success=false. Response:"
            cat "$response_file"
            exit 1
          fi
          echo "Cloudflare Containers API access is confirmed."

      - name: Install Worker tooling
        working-directory: backend
        run: npm install

      - name: Check Docker engine
        run: docker info

      - name: Deploy API Container Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify live API and database through Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://mr-ai-stan.pages.dev/api/health"
          last_response="No response received."
          for attempt in $(seq 1 18); do
            last_response="$(curl --connect-timeout 5 --max-time 12 -sS "$health_url" 2>&1 || true)"
            if printf '%s' "$last_response" | python -c '
          import json, sys
          try:
              payload = json.load(sys.stdin)
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if payload.get("status") == "healthy" and payload.get("database") == "reachable" else 1)
          '; then
              echo "Live API health check passed: $last_response"
              exit 0
            fi
            echo "Health check attempt $attempt/18 did not pass yet."
            sleep 10
          done
          echo "::error::Cloudflare deployment did not pass the live API/database health check."
          echo "Last response: $last_response"
          exit 1
