name: MR AI STAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend tests
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          pytest -q
      - name: Import FastAPI app
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -c "from app.main import app; print(app.title); print(len(app.routes), \"routes loaded\")"

      - name: Verify configured PostgreSQL connection
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA_CERT: ${{ secrets.DATABASE_SSL_CA_CERT }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PostgreSQL smoke test skipped: DATABASE_URL Actions secret is not configured."
            exit 0
          fi
          cd backend
          python - <<'PY'
          from sqlalchemy import text
          from app.database import engine
          assert engine.dialect.name == "postgresql", "DATABASE_URL must point to PostgreSQL for the production smoke test."
          with engine.connect() as connection:
              result = connection.execute(text("select 1")).scalar_one()
              assert result == 1
              print("PostgreSQL connection: OK")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Validate Cloudflare Pages and Container bindings
        run: |
          node --check 'web/functions/api/[[path]].js'
          node --check backend/container-worker.js
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const pages = JSON.parse(fs.readFileSync("web/wrangler.jsonc", "utf8"));
          const api = JSON.parse(fs.readFileSync("backend/wrangler.jsonc", "utf8"));
          const proxy = fs.readFileSync("web/functions/api/[[path]].js", "utf8");
          assert(api.name === "mr-ai-stan-api", "Cloudflare API Worker name changed unexpectedly");
          assert(api.main === "container-worker.js", "API Worker entry point is missing");
          assert(api.containers?.some(item => item.class_name === "MrAiApiContainer"), "Cloudflare Container declaration is missing");
          assert(api.triggers?.crons?.includes("* * * * *"), "Scheduler Cron trigger is missing");
          assert(pages.services?.some(item => item.binding === "MR_AI_API" && item.service === api.name), "Pages service binding does not target the API Worker");
          assert(proxy.includes("context.env.MR_AI_API"), "Pages API proxy does not use the Cloudflare service binding");
          assert(!proxy.includes("MR_AI_API_URL") && !proxy.includes("onrender.com"), "External Render API dependency remains in the Pages proxy");
          console.log("Cloudflare Pages/Container wiring: OK");
          NODE
      - name: Build frontend
        working-directory: web
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension manifest and production controller wiring
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
          const origin = "https://mr-ai-stan.pages.dev/*";
          assert(manifest.host_permissions.includes(origin), "Production Pages API host permission is missing");
          assert(manifest.externally_connectable.matches.includes(origin), "Production Pages controller origin is not externally connectable");
          const background = fs.readFileSync("extension/background.js", "utf8");
          assert(background.split("\n").some(line => line.includes("mr-ai-stan") && line.includes("pages")), "Production Pages controller pattern is missing");
          const popup = fs.readFileSync("extension/popup.js", "utf8");
          assert(popup.includes("https://mr-ai-stan.pages.dev/api"), "Extension popup does not use the production Pages API proxy");
          const content = fs.readFileSync("extension/content.js", "utf8");
          assert(content.includes("resulting application state was not independently verified"), "Browser action verification caveat is missing");
          const api = fs.readFileSync("web/src/api.js", "utf8");
          assert(api.includes("MR_AI_AUTH_TOKEN"), "Dashboard does not sync the JWT to the extension popup");
          assert(background.includes("MR_AI_AUTH_TOKEN"), "Extension does not store the dashboard JWT for popup use");
          console.log("Extension manifest, production controller, and auth sync: OK");
          NODE
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

  device_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: python -m pip install -r device-bridge/requirements.txt
      - name: Compile device bridge
        run: python -m compileall -q device-bridge
