name: MR AI STAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend tests
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          pytest -q
      - name: Import FastAPI app
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -c "from app.main import app; print(app.title); print(len(app.routes), \"routes loaded\")"

      - name: Verify Supabase connection
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_UR }}
          DATABASE_SSL_CA_CERT: ${{ secrets.DATABASE_SSL_CA_CERT }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Supabase smoke test skipped: DATABASE_URL/DATABASE_UR secret is not configured."
            exit 0
          fi
          if [ -z "$DATABASE_SSL_CA_CERT" ]; then
            echo "::warning::Supabase smoke test skipped: add DATABASE_SSL_CA_CERT as a trusted PEM certificate secret to verify this database's TLS chain."
            exit 0
          fi
          cd backend
          python - <<'PY'
          from sqlalchemy import text
          from app.database import engine
          with engine.connect() as connection:
              result = connection.execute(text("select 1")).scalar_one()
              assert result == 1
              print("Supabase/PostgreSQL connection: OK")
          PY

  cloudflare_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloudflare Worker dependencies
        working-directory: backend
        run: npm install
      - name: Validate Cloudflare Container Worker
        working-directory: backend
        run: |
          npm run check
          node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8')); console.log('Cloudflare Worker config JSON: OK')"
      - name: Validate Pages API proxy
        run: node --check 'web/functions/api/[[path]].js'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Validate Pages API proxy syntax
        run: node --check 'web/functions/api/[[path]].js'
      - name: Build frontend
        working-directory: web
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

  device_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: python -m pip install -r device-bridge/requirements.txt
      - name: Compile device bridge
        run: python -m compileall -q device-bridge
