name: MR AI STAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend tests
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          pytest -q
      - name: Import FastAPI app
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -c "from app.main import app; print(app.title); print(len(app.routes), \"routes loaded\")"

      - name: Verify configured PostgreSQL connection
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA_CERT: ${{ secrets.DATABASE_SSL_CA_CERT }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PostgreSQL smoke test skipped: DATABASE_URL secret is not configured."
            exit 0
          fi
          if [ -z "$DATABASE_SSL_CA_CERT" ]; then
            echo "::warning::PostgreSQL smoke test skipped: add DATABASE_SSL_CA_CERT as a trusted PEM certificate secret if this database requires a custom CA."
            exit 0
          fi
          cd backend
          python - <<'PY'
          from sqlalchemy import text
          from app.database import engine
          with engine.connect() as connection:
              result = connection.execute(text("select 1")).scalar_one()
              assert result == 1
              print("PostgreSQL connection: OK")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Validate Render frontend/API wiring
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const blueprint = fs.readFileSync("render.yaml", "utf8");
          assert(blueprint.includes("name: mr-ai-stan-api"), "Render API service is missing");
          assert(blueprint.includes("name: mr-ai-stan-web"), "Render frontend service is missing");
          assert(blueprint.includes("key: VITE_API_URL"), "Render frontend API URL is missing");
          assert(blueprint.includes("envVarKey: RENDER_EXTERNAL_URL"), "Frontend is not wired to the Render API URL");
          assert(!blueprint.includes("pages.dev"), "Legacy Cloudflare Pages URL remains in Render Blueprint");
          const api = fs.readFileSync("web/src/api.js", "utf8");
          assert(api.includes("VITE_API_URL"), "Frontend does not read its Render API URL");
          console.log("Render frontend/API wiring: OK");
          NODE
      - name: Build frontend
        working-directory: web
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension manifest and production controller wiring
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
          const frontendOrigin = "https://mr-ai-stan-web.onrender.com/*";
          const apiOrigin = "https://mr-ai-stan-api.onrender.com/*";
          assert(manifest.host_permissions.includes(frontendOrigin), "Render frontend host permission is missing");
          assert(manifest.host_permissions.includes(apiOrigin), "Render API host permission is missing");
          assert(manifest.externally_connectable.matches.includes(frontendOrigin), "Render controller origin is not externally connectable");
          const background = fs.readFileSync("extension/background.js", "utf8");
          assert(background.split("\\n").some(line => line.includes("mr-ai-stan-web") && line.includes("onrender.com")), "Render controller pattern is missing");
          const popup = fs.readFileSync("extension/popup.js", "utf8");
          assert(popup.includes("https://mr-ai-stan-api.onrender.com"), "Extension popup does not use the Render API");
          const content = fs.readFileSync("extension/content.js", "utf8");
          assert(content.includes("resulting application state was not independently verified"), "Browser action verification caveat is missing");
          const api = fs.readFileSync("web/src/api.js", "utf8");
          assert(api.includes("MR_AI_AUTH_TOKEN"), "Dashboard does not sync the JWT to the extension popup");
          assert(background.includes("MR_AI_AUTH_TOKEN"), "Extension does not store the dashboard JWT for popup use");
          console.log("Extension manifest, production controller, and auth sync: OK");
          NODE
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

  device_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: python -m pip install -r device-bridge/requirements.txt
      - name: Compile device bridge
        run: python -m compileall -q device-bridge
