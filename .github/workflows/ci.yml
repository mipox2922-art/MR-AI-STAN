name: MR AI STAN CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Run backend tests
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          pytest -q
      - name: Import FastAPI app
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -c "from app.main import app; print(app.title); print(len(app.routes), \"routes loaded\")"

      - name: Verify configured PostgreSQL connection
        env:
          SECRET_KEY: ci-only-secret-for-mr-ai-stan-tests-not-for-production-2026
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL_CA_CERT: ${{ secrets.DATABASE_SSL_CA_CERT }}
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "PostgreSQL smoke test skipped: DATABASE_URL Actions secret is not configured."
            exit 0
          fi
          cd backend
          python - <<'PY'
          from sqlalchemy import text
          from app.database import engine
          assert engine.dialect.name == "postgresql", "DATABASE_URL must point to PostgreSQL for the production smoke test."
          with engine.connect() as connection:
              result = connection.execute(text("select 1")).scalar_one()
              assert result == 1
              print("PostgreSQL connection: OK")
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browser for interactive UI smoke tests
        working-directory: web
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start Vite for browser smoke test
        working-directory: web
        env:
          VITE_API_URL: https://mr-ai-stan.onrender.com
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/mrai-vite.log 2>&1 &
          echo $! > /tmp/mrai-vite.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mrai-vite.log
          exit 1
      - name: Exercise command center in Chromium with mocked external integrations
        working-directory: web
        env:
          VITE_API_URL: https://mr-ai-stan.onrender.com
          UI_SMOKE_URL: http://127.0.0.1:5173
        run: |
          node scripts/ui-smoke.mjs || {
            echo "--- Vite transform/server log ---"
            cat /tmp/mrai-vite.log || true
            exit 1
          }
      - name: Validate Render static site and frontend API configuration
        run: |
          node --check web/src/api.js
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const render = fs.readFileSync("render.yaml", "utf8");
          const apiClient = fs.readFileSync("web/src/api.js", "utf8");
          assert(render.includes("name: mr-ai-stan-web"), "Render frontend service name is missing");
          assert(render.includes("runtime: static"), "Frontend must deploy as a free static site");
          assert(render.includes("rootDir: web"), "Render frontend root directory is incorrect");
          assert(render.includes("staticPublishPath: dist"), "Render publish directory is incorrect");
          assert(render.includes("value: https://mr-ai-stan.onrender.com"), "Render API URL is missing from the frontend build configuration");
          assert(apiClient.includes("VITE_API_URL"), "Frontend API client must honor VITE_API_URL");
          console.log("Render frontend/API configuration: OK");
          NODE
      - name: Build frontend
        working-directory: web
        env:
          VITE_API_URL: https://mr-ai-stan.onrender.com
        run: npm run build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension manifest and production controller wiring
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
          const frontendOrigin = "https://mr-ai-stan-web.onrender.com/*";
          const apiOrigin = "https://mr-ai-stan.onrender.com/*";
          assert(manifest.host_permissions.includes(apiOrigin), "Render API host permission is missing");
          assert(manifest.externally_connectable.matches.includes(frontendOrigin), "Render frontend controller origin is not externally connectable");
          const background = fs.readFileSync("extension/background.js", "utf8");
          assert(background.includes("mr-ai-stan-web") && background.includes("onrender"), "Production Render controller pattern is missing");
          const popup = fs.readFileSync("extension/popup.js", "utf8");
          assert(popup.includes("https://mr-ai-stan.onrender.com"), "Extension popup does not use the production Render API");
          const content = fs.readFileSync("extension/content.js", "utf8");
          assert(content.includes("resulting application state was not independently verified"), "Browser action verification caveat is missing");
          const api = fs.readFileSync("web/src/api.js", "utf8");
          assert(api.includes("MR_AI_AUTH_TOKEN"), "Dashboard does not sync the JWT to the extension popup");
          assert(background.includes("MR_AI_AUTH_TOKEN"), "Extension does not store the dashboard JWT for popup use");
          console.log("Extension manifest, production controller, and auth sync: OK");
          NODE
      - name: Validate extension JavaScript
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

  device_bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: python -m pip install -r device-bridge/requirements.txt
      - name: Compile device bridge
        run: python -m compileall -q device-bridge

  production-smoke:
    name: Live Render smoke test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [backend, frontend, extension, device_bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the deployed frontend, API, database health, and auth guard
        env:
          WEB_URL: https://mr-ai-stan-web.onrender.com
          API_URL: https://mr-ai-stan.onrender.com
          REQUIRE_POSTGRES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          web_url = os.environ["WEB_URL"].rstrip("/")
          api_url = os.environ["API_URL"].rstrip("/")

          def get(url, timeout=20):
              request = Request(url, headers={"User-Agent": "MR-AI-live-smoke/1.0"})
              try:
                  with urlopen(request, timeout=timeout) as response:
                      return response.status, response.read().decode("utf-8", "replace")
              except HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", "replace")
              except (URLError, TimeoutError, OSError) as exc:
                  return 0, str(exc)

          # The static frontend should answer directly from Render's CDN.
          web_ok = False
          for attempt in range(1, 7):
              code, body = get(web_url + "/", timeout=15)
              if code == 200 and 'id="root"' in body and "MR AI" in body:
                  print(f"PASS frontend: HTTP {code}, MR AI shell present (attempt {attempt})")
                  web_ok = True
                  break
              print(f"Frontend attempt {attempt}/6: HTTP {code}; retrying")
              time.sleep(5)
          if not web_ok:
              raise SystemExit("FAIL frontend: deployed static site did not serve the expected MR AI shell")

          # A Render Free service may need a cold start. /health probes the real DB.
          # On pushes to main (after deploy), also prove production is using PostgreSQL,
          # not an ephemeral SQLite fallback. PR checks tolerate the old response until
          # the candidate is merged and deployed.
          require_postgres = os.environ.get("REQUIRE_POSTGRES", "false").lower() == "true"
          health = None
          for attempt in range(1, 19):
              code, body = get(api_url + "/health", timeout=20)
              try:
                  payload = json.loads(body)
              except (TypeError, ValueError):
                  payload = {}
              healthy = code == 200 and payload.get("status") == "healthy" and payload.get("database") == "reachable"
              engine = payload.get("database_engine")
              engine_ok = engine == "postgresql" if require_postgres else engine in (None, "postgresql")
              if healthy and engine_ok:
                  health = payload
                  label = f"PostgreSQL ({engine})" if engine else "database reachable (legacy health response)"
                  print(f"PASS API/database: HTTP {code}, {label} (attempt {attempt})")
                  break
              detail = str(payload.get("detail") or payload.get("status") or body[:100]).replace("\\n", " ")
              if healthy and require_postgres and engine != "postgresql":
                  detail = f"expected database_engine=postgresql, got {engine!r}"
              print(f"API health attempt {attempt}/18: HTTP {code}; {detail}; retrying")
              time.sleep(10)
          if health is None:
              raise SystemExit("FAIL API/database: /health did not confirm a healthy PostgreSQL database")

          code, body = get(api_url + "/", timeout=20)
          try:
              payload = json.loads(body)
          except (TypeError, ValueError):
              payload = {}
          if code != 200 or payload.get("status") != "ONLINE":
              raise SystemExit(f"FAIL API root: HTTP {code}; expected JSON status ONLINE")
          print("PASS API root: HTTP 200, status ONLINE")

          code, body = get(api_url + "/auth/status", timeout=20)
          try:
              payload = json.loads(body)
          except (TypeError, ValueError):
              payload = {}
          if code != 200 or not isinstance(payload.get("setup_required"), bool):
              raise SystemExit(f"FAIL auth setup status: HTTP {code}; expected a database-backed boolean")
          print(f"PASS auth setup endpoint: HTTP 200, setup_required={payload['setup_required']}")

          code, _ = get(api_url + "/system/status", timeout=20)
          if code not in (401, 403):
              raise SystemExit(f"FAIL auth guard: unauthenticated /system/status returned HTTP {code}, expected 401/403")
          print(f"PASS auth guard: unauthenticated protected endpoint returns HTTP {code}")
          PY
