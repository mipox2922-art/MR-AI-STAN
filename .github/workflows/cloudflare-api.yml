name: Deploy MR AI Cloudflare API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/cloudflare-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy FastAPI backend to Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DATABASE_UR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$DATABASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token or Supabase database secret is not configured. Deployment is skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        if: steps.secrets.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Worker dependencies
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: uv sync

      - name: Configure persistent Worker database secret
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: |
          printf '%s' "$DATABASE_URL" | uv run pywrangler secret put DATABASE_URL --name mr-ai-stan-api

      - name: Ensure persistent JWT secret
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: |
          SECRETS_JSON="$(uv run pywrangler secret list --name mr-ai-stan-api --format json)"
          if ! printf '%s' "$SECRETS_JSON" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if any(x.get("name")=="SECRET_KEY" for x in d) else 1)'; then
            openssl rand -base64 48 | tr -d '\n' | uv run pywrangler secret put SECRET_KEY --name mr-ai-stan-api
          fi

      - name: Deploy Worker
        if: steps.secrets.outputs.ready == 'true'
        working-directory: backend
        run: |
          mv requirements.txt /tmp/mr-ai-backend-requirements.txt
          trap 'mv /tmp/mr-ai-backend-requirements.txt requirements.txt' EXIT
          uv run pywrangler deploy
