<!doctype html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR AI — Chief of Staff</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #080b12; color: #f5f7fb; }
    .app { min-height: 100vh; display: grid; place-items: center; padding: 32px; }
    .panel { width: min(900px, 100%); background: #101522; border: 1px solid #273047; border-radius: 24px; padding: 36px; box-shadow: 0 20px 70px rgba(0,0,0,.35); }
    .eyebrow { color: #7ea6ff; font-weight: 700; letter-spacing: .16em; font-size: 12px; }
    h1 { margin: 10px 0 4px; font-size: 42px; }
    .sub { color: #9aa6bd; margin-bottom: 32px; }
    .orb { width: 170px; height: 170px; margin: 20px auto; border-radius: 50%; border: 2px solid #5c7cff; display: grid; place-items: center; background: radial-gradient(circle, #23346d, #0d1220 65%); box-shadow: 0 0 50px rgba(92,124,255,.25); }
    .orb span { font-size: 48px; font-weight: 800; }
    .status { text-align: center; color: #aeb9cf; min-height: 24px; }
    .controls { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
    button { border: 0; border-radius: 12px; padding: 13px 20px; font-weight: 700; cursor: pointer; background: #5c7cff; color: white; }
    button.secondary { background: #20283a; }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="eyebrow">MR AI • CHIEF OF STAFF</div>
      <h1>Hey Ferisi 👋</h1>
      <div class="sub">Msaidizi wako wa desktop — voice-first, Kiswahili-ready.</div>
      <div class="orb"><span>MR</span></div>
      <div id="status" class="status">Tayari. Bonyeza kusema.</div>
      <div class="controls">
        <button id="speak">Jaribu Sauti</button>
        <button id="ready" class="secondary">Niko Tayari</button>
      </div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
