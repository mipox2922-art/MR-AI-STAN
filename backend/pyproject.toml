[project]
name = "mr-ai-stan-backend-worker"
version = "1.0.0"
description = "MR AI FastAPI backend packaged for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "sqlalchemy",
  "psycopg[binary]>=3.2,<4",
  "pydantic",
  "pydantic-settings",
  "python-jose[cryptography]",
  "httpx",
  "python-multipart",
  "email-validator",
  "pwdlib[argon2]",
  "cryptography",
  "openai",
  "google-genai",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
