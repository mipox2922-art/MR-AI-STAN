services:

  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  web:
    image: node:24
    depends_on:
      - backend
    environment:
      MR_AI_BACKEND_URL: http://backend:8000
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
