services:
  - type: web
    name: mr-ai-stan-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA_CERT
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SERVERLESS_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "https://mr-ai-stan.pages.dev"
      - key: GEMINI_API_KEY
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: GMAIL_CLIENT_ID
        value: "915582116434-57794p02eorjkpmrbu2ian4r9btclo8f.apps.googleusercontent.com"
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        value: "https://mr-ai-stan.pages.dev/api/integrations/gmail/callback"
      - key: GMAIL_SCOPES
        value: "https://www.googleapis.com/auth/gmail.readonly"
