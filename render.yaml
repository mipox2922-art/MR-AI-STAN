services:
  - type: web
    name: mr-ai-stan-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - web/**
        - render.yaml
    envVars:
      - key: VITE_API_URL
        value: https://mr-ai-stan.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
