services:
  - type: web
    name: mr-ai-stan-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - web/**
        - render.yaml
    envVars:
      - key: VITE_API_URL
        value: https://mr-ai-stan.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Existing Render backend: Blueprint wiring ensures it uses the managed database.
  - type: web
    name: MR-AI-STAN
    runtime: docker
    branch: main
    plan: free
    region: virginia
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mr-ai-stan-db
          property: connectionString
      # Set only after the migration workflow verifies the target restore.
      # Empty/unset keeps the original Render database as the rollback source.
      - key: DATABASE_URL_OVERRIDE
        sync: false

databases:
  # Free for first-run validation; Render expires free Postgres after 30 days.
  - name: mr-ai-stan-db
    databaseName: mr_ai_stan_db
    user: mr_ai_stan_db_user
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    connectionPool: none
    storageAutoscalingEnabled: false
    ipAllowList: []
